name: chat_app
description: A Flutter chat application
version: 1.0.0+1
publish_to: 'none' # since this is a local project

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_messaging: ^14.7.19
  firebase_storage: ^11.7.0

  # Notifications
  flutter_local_notifications: ^17.0.0
  flutter_app_badger: ^1.5.0

  # State management
  provider: ^6.1.2

  # Other utilities
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
